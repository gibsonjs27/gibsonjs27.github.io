<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>JSG Systems – Landing Page</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fb;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .card {
      background: #ffffff;
      padding: 2.5rem 3rem;
      border-radius: 18px;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
      text-align: center;
      max-width: 480px;
    }

    h1 {
      margin: 0 0 0.75rem;
      font-size: 1.9rem;
      color: #111827;
    }

    p {
      margin: 0 0 1.75rem;
      color: #4b5563;
      line-height: 1.5;
    }

    .cta-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.85rem 1.8rem;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-size: 0.98rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #ffffff;
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      box-shadow: 0 12px 24px rgba(37, 99, 235, 0.35);
      transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
      text-decoration: none;
    }

    .cta-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 32px rgba(37, 99, 235, 0.45);
      filter: brightness(1.03);
    }

    .cta-btn:active {
      transform: translateY(1px);
      box-shadow: 0 8px 18px rgba(37, 99, 235, 0.35);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Welcome to JSG Systems</h1>
    <p>
      For support, suggestions or general inquiries, you can reach our admin team directly via email by clicking the button below.
    </p>

    <a class="cta-btn" href="mailto:admin.jsg.systems">
      Email Admin
    </a>
  </main>
</body>
</html>
